name: Cleanup Practice Glue Setup

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: "493272324412"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493272324412:role/github-ecr-role
          aws-region: us-east-1

      - name: Verify AWS account
        shell: bash
        run: |
          set -e
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACTUAL_ACCOUNT" != "$ACCOUNT_ID" ]; then
            echo "Wrong AWS account. Stopping."
            exit 1
          fi
          echo "Verified account: $ACTUAL_ACCOUNT"

      - name: Delete practice Glue job
        shell: bash
        run: |
          if aws glue get-job --job-name practice-assume-role-job >/dev/null 2>&1; then
            aws glue delete-job --job-name practice-assume-role-job
            echo "Deleted practice Glue job."
          else
            echo "Practice Glue job not found."
          fi

      - name: Delete practice IAM roles
        shell: bash
        run: |
          set -e

          for ROLE in practice-glue-role practice-redshift-s3-role; do
            if ! aws iam get-role --role-name "$ROLE" >/dev/null 2>&1; then
              echo "Role not found: $ROLE"
              continue
            fi

            ATTACHED=$(aws iam list-attached-role-policies \
              --role-name "$ROLE" \
              --query 'AttachedPolicies[].PolicyArn' --output text)

            for POLICY_ARN in $ATTACHED; do
              [ "$POLICY_ARN" = "None" ] && continue
              aws iam detach-role-policy \
                --role-name "$ROLE" --policy-arn "$POLICY_ARN"
            done

            INLINE=$(aws iam list-role-policies \
              --role-name "$ROLE" \
              --query 'PolicyNames[]' --output text)

            for POLICY_NAME in $INLINE; do
              [ "$POLICY_NAME" = "None" ] && continue
              aws iam delete-role-policy \
                --role-name "$ROLE" --policy-name "$POLICY_NAME"
            done

            PROFILES=$(aws iam list-instance-profiles-for-role \
              --role-name "$ROLE" \
              --query 'InstanceProfiles[].InstanceProfileName' --output text)

            for PROFILE in $PROFILES; do
              [ "$PROFILE" = "None" ] && continue
              aws iam remove-role-from-instance-profile \
                --instance-profile-name "$PROFILE" --role-name "$ROLE"
              aws iam delete-instance-profile \
                --instance-profile-name "$PROFILE"
            done

            aws iam delete-role --role-name "$ROLE"
            echo "Deleted role: $ROLE"
          done

      - name: Verify cleanup
        shell: bash
        run: |
          set -e

          for ROLE in practice-glue-role practice-redshift-s3-role; do
            if aws iam get-role --role-name "$ROLE" >/dev/null 2>&1; then
              echo "ERROR: Role still exists: $ROLE"
              exit 1
            fi
          done

          if aws glue get-job --job-name practice-assume-role-job >/dev/null 2>&1; then
            echo "ERROR: Glue job still exists."
            exit 1
          fi

          echo "Cleanup completed successfully."
