```yaml
name: Cleanup Practice Glue Setup

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: "493272324412"

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493272324412:role/github-ecr-role
          aws-region: us-east-1

      - name: Verify AWS account
        run: |
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity \
            --query Account --output text)

          if [ "$ACTUAL_ACCOUNT" != "$ACCOUNT_ID" ]; then
            echo "Wrong AWS account. Cleanup stopped."
            exit 1
          fi

          echo "Verified personal AWS account: $ACTUAL_ACCOUNT"

      - name: Delete practice Glue job
        run: |
          if aws glue get-job \
            --job-name practice-assume-role-job >/dev/null 2>&1; then
            aws glue delete-job \
              --job-name practice-assume-role-job
            echo "Deleted practice Glue job."
          else
            echo "Practice Glue job not found."
          fi

      - name: Delete practice IAM roles
        run: |
          for ROLE in practice-glue-role practice-redshift-s3-role; do
            if aws iam get-role --role-name "$ROLE" >/dev/null 2>&1; then

              # Detach managed policies
              for POLICY in $(aws iam list-attached-role-policies \
                --role-name "$ROLE" \
                --query 'AttachedPolicies[].PolicyArn' \
                --output text); do
                [ "$POLICY" = "None" ] && continue
                aws iam detach-role-policy \
                  --role-name "$ROLE" \
                  --policy-arn "$POLICY"
              done

              # Delete inline policies
              for POLICY in $(aws iam list-role-policies \
                --role-name "$ROLE" \
                --query 'PolicyNames[]' \
                --output text); do
                [ "$POLICY" = "None" ] && continue
                aws iam delete-role-policy \
                  --role-name "$ROLE" \
                  --policy-name "$POLICY"
              done

              # Remove role from instance profiles, if any
              for PROFILE in $(aws iam list-instance-profiles-for-role \
                --role-name "$ROLE" \
                --query 'InstanceProfiles[].InstanceProfileName' \
                --output text); do
                [ "$PROFILE" = "None" ] && continue
                aws iam remove-role-from-instance-profile \
                  --instance-profile-name "$PROFILE" \
                  --role-name "$ROLE"
              done

              # Delete empty instance profiles
              for PROFILE in $(aws iam list-instance-profiles-for-role \
                --role-name "$ROLE" \
                --query 'InstanceProfiles[].InstanceProfileName' \
                --output text); do
                [ "$PROFILE" = "None" ] && continue
                aws iam delete-instance-profile \
                  --instance-profile-name "$PROFILE"
              done

              aws iam delete-role --role-name "$ROLE"
              echo "Deleted IAM role: $ROLE"
            else
              echo "IAM role not found: $ROLE"
            fi
          done

      - name: Verify cleanup
        run: |
          for ROLE in practice-glue-role practice-redshift-s3-role; do
            if aws iam get-role --role-name "$ROLE" >/dev/null 2>&1; then
              echo "ERROR: Role still exists: $ROLE"
              exit 1
            fi
          done

          if aws glue get-job \
            --job-name practice-assume-role-job >/dev/null 2>&1; then
            echo "ERROR: Glue job still exists."
            exit 1
          fi

          echo "Cleanup completed successfully."
```
