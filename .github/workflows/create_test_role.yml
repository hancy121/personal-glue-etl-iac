name: Create Test IAM Role

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "493272324412"

  # ============================================================
  # GitHub OIDC deployment role
  # Created by bootstrap/github-oidc-role.yml
  # ============================================================

  PROD_GITHUB_OIDC_ROLE: personal-prod-github-oidc-role

  # ============================================================
  # New role that this workflow will create
  # ============================================================

  PROD_LAMBDA_ROLE_NAME: practice-glue-lambda-role


jobs:

  create-role:

    name: Create Practice IAM Role

    runs-on: ubuntu-latest


    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. CONFIGURE AWS USING GITHUB OIDC
      # ==========================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.PROD_GITHUB_OIDC_ROLE }}

          aws-region: ${{ env.AWS_REGION }}


      # ==========================================================
      # 3. VERIFY AWS IDENTITY
      # ==========================================================

      - name: Verify AWS Identity
        run: |

          echo "======================================"
          echo "AWS ACCOUNT"
          echo "======================================"

          aws sts get-caller-identity


      # ==========================================================
      # 4. CREATE TRUST POLICY
      #
      # Same logic as your Dev create_iam_role.yml
      # ==========================================================

      - name: Create Trust Policy
        run: |

          cat <<EOF > trust-policy.json
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Service": "lambda.amazonaws.com"
                },
                "Action": "sts:AssumeRole"
              }
            ]
          }
          EOF

          echo "======================================"
          echo "TRUST POLICY"
          echo "======================================"

          cat trust-policy.json


      # ==========================================================
      # 5. CREATE IAM ROLE
      # ==========================================================

      - name: Create IAM Role
        run: |

          aws iam create-role \
            --role-name "$PROD_LAMBDA_ROLE_NAME" \
            --assume-role-policy-document file://trust-policy.json

          echo ""
          echo "IAM ROLE CREATED:"
          echo "$PROD_LAMBDA_ROLE_NAME"


      # ==========================================================
      # 6. CREATE DEV-STYLE PERMISSIONS
      #
      # Copied from your Dev create_iam_role.yml
      # ==========================================================

      - name: Create Permissions Policy
        run: |

          cat <<EOF > policy.json
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "CloudWatchLogs",
                "Effect": "Allow",
                "Action": [
                  "logs:CreateLogGroup",
                  "logs:CreateLogStream",
                  "logs:PutLogEvents"
                ],
                "Resource": "*"
              },
              {
                "Sid": "ReadShapData",
                "Effect": "Allow",
                "Action": [
                  "s3:GetObject",
                  "s3:ListBucket"
                ],
                "Resource": "*"
              }
            ]
          }
          EOF

          echo "======================================"
          echo "PERMISSIONS POLICY"
          echo "======================================"

          cat policy.json


      # ==========================================================
      # 7. ATTACH INLINE POLICY
      #
      # Same as Dev:
      #
      # aws iam put-role-policy
      # ==========================================================

      - name: Attach Inline Policy
        run: |

          aws iam put-role-policy \
            --role-name "$PROD_LAMBDA_ROLE_NAME" \
            --policy-name glue-job-inline-policy \
            --policy-document file://policy.json


      # ==========================================================
      # 8. VERIFY ROLE
      # ==========================================================

      - name: Verify IAM Role
        run: |

          echo "======================================"
          echo "ROLE INFORMATION"
          echo "======================================"

          aws iam get-role \
            --role-name "$PROD_LAMBDA_ROLE_NAME"


          echo ""
          echo "======================================"
          echo "INLINE POLICY"
          echo "======================================"

          aws iam get-role-policy \
            --role-name "$PROD_LAMBDA_ROLE_NAME" \
            --policy-name glue-job-inline-policy


      # ==========================================================
      # 9. LIST ROLE POLICIES
      # ==========================================================

      - name: List Role Policies
        run: |

          echo "======================================"
          echo "ROLE POLICIES"
          echo "======================================"

          aws iam list-role-policies \
            --role-name "$PROD_LAMBDA_ROLE_NAME"


      # ==========================================================
      # 10. COMPLETE
      # ==========================================================

      - name: Completed
        run: |

          echo "======================================"
          echo "IAM ROLE CREATION COMPLETE"
          echo "======================================"

          echo "Account: $AWS_ACCOUNT_ID"
          echo "Region:  $AWS_REGION"
          echo "Role:    $PROD_LAMBDA_ROLE_NAME"
