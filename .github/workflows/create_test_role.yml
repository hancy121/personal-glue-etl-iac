name: Create Test IAM Role

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "493272324412"
  DEPLOYMENT_ROLE: github-ecr-role
  TEST_ROLE_NAME: practice-glue-lambda-role

jobs:
  create-role:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOYMENT_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Create IAM role
        shell: bash
        run: |
          set -e

          cat > trust-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Service": "lambda.amazonaws.com"
                },
                "Action": "sts:AssumeRole"
              }
            ]
          }
          EOF

          if aws iam get-role --role-name "$TEST_ROLE_NAME" >/dev/null 2>&1; then
            echo "Role already exists: $TEST_ROLE_NAME"
          else
            aws iam create-role \
              --role-name "$TEST_ROLE_NAME" \
              --assume-role-policy-document file://trust-policy.json

            echo "Role created."
          fi

      - name: Apply initial permissions
        shell: bash
        run: |
          set -e

          cat > glue-job-inline-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "logs:CreateLogGroup",
                  "logs:CreateLogStream",
                  "logs:PutLogEvents"
                ],
                "Resource": "*"
              },
              {
                "Effect": "Allow",
                "Action": [
                  "s3:GetObject",
                  "s3:ListBucket"
                ],
                "Resource": "*"
              }
            ]
          }
          EOF

          aws iam put-role-policy \
            --role-name "$TEST_ROLE_NAME" \
            --policy-name glue-job-inline-policy \
            --policy-document file://glue-job-inline-policy.json

          echo "Initial permissions applied."

      - name: Verify role
        run: |
          echo "=== IAM Role ==="

          aws iam get-role \
            --role-name "$TEST_ROLE_NAME"

          echo "=== Inline Policies ==="

          aws iam list-role-policies \
            --role-name "$TEST_ROLE_NAME"

          echo "Role creation and policy application successful."
