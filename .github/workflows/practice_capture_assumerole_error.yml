name: Practice Capture AssumeRole Error

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  GLUE_JOB_NAME: practice-assume-role-job

jobs:
  reproduce-error:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493272324412:role/github-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Start Glue Job
        id: start
        run: |
          JOB_RUN_ID=$(aws glue start-job-run \
            --job-name "$GLUE_JOB_NAME" \
            --region "$AWS_REGION" \
            --query 'JobRunId' \
            --output text)

          if [ -z "$JOB_RUN_ID" ] || [ "$JOB_RUN_ID" = "None" ]; then
            echo "Failed to obtain Glue Job Run ID."
            exit 1
          fi

          echo "JOB_RUN_ID=$JOB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Started Glue job: $GLUE_JOB_NAME"
          echo "Job Run ID: $JOB_RUN_ID"

      - name: Wait for Glue Job
        id: wait
        env:
          JOB_RUN_ID: ${{ steps.start.outputs.JOB_RUN_ID }}
        run: |
          STATUS="UNKNOWN"

          for attempt in $(seq 1 90); do
            STATUS=$(aws glue get-job-run \
              --job-name "$GLUE_JOB_NAME" \
              --run-id "$JOB_RUN_ID" \
              --region "$AWS_REGION" \
              --query 'JobRun.JobRunState' \
              --output text)

            echo "Attempt $attempt: $STATUS"

            case "$STATUS" in
              SUCCEEDED|FAILED|TIMEOUT|STOPPED|ERROR|EXPIRED)
                break
                ;;
            esac

            sleep 10
          done

          echo "FINAL_STATUS=$STATUS" >> "$GITHUB_OUTPUT"

          if [[ "$STATUS" != "FAILED" &&
                "$STATUS" != "TIMEOUT" &&
                "$STATUS" != "ERROR" ]]; then
            echo "Job did not reach an expected failure state."
            echo "Final status: $STATUS"
            exit 1
          fi

      - name: Get Glue Job Error Details
        id: details
        if: always() && steps.start.outputs.JOB_RUN_ID != ''
        env:
          JOB_RUN_ID: ${{ steps.start.outputs.JOB_RUN_ID }}
        run: |
          echo "===== GLUE JOB DETAILS ====="

          aws glue get-job-run \
            --job-name "$GLUE_JOB_NAME" \
            --run-id "$JOB_RUN_ID" \
            --region "$AWS_REGION" \
            --query 'JobRun.{State:JobRunState,Error:ErrorMessage,LogGroup:LogGroupName,Arguments:Arguments}' \
            --output json

          ERROR_MESSAGE=$(aws glue get-job-run \
            --job-name "$GLUE_JOB_NAME" \
            --run-id "$JOB_RUN_ID" \
            --region "$AWS_REGION" \
            --query 'JobRun.ErrorMessage' \
            --output text)

          echo "===== GLUE ERROR MESSAGE ====="
          echo "$ERROR_MESSAGE"

          echo "===== CLOUDWATCH ERROR LOGS ====="

          LOG_GROUP="/aws-glue/jobs/error"

          aws logs filter-log-events \
            --log-group-name "$LOG_GROUP" \
            --region "$AWS_REGION" \
            --filter-pattern '"AccessDenied"' \
            --start-time "$(( ($(date +%s) - 3600) * 1000 ))" \
            --query 'events[].message' \
            --output text || true

          echo "===== RUN-SPECIFIC OUTPUT ====="

          aws logs filter-log-events \
            --log-group-name "/aws-glue/jobs/output" \
            --region "$AWS_REGION" \
            --filter-pattern '"ASSUME ROLE FAILED"' \
            --start-time "$(( ($(date +%s) - 3600) * 1000 ))" \
            --query 'events[].message' \
            --output text || true

      - name: Confirm Expected AssumeRole Failure
        if: always() && steps.start.outputs.JOB_RUN_ID != ''
        env:
          JOB_RUN_ID: ${{ steps.start.outputs.JOB_RUN_ID }}
          FINAL_STATUS: ${{ steps.wait.outputs.FINAL_STATUS }}
        run: |
          echo "===== REPRODUCTION RESULT ====="

          aws glue get-job-run \
            --job-name "$GLUE_JOB_NAME" \
            --run-id "$JOB_RUN_ID" \
            --region "$AWS_REGION" \
            --query 'JobRun.ErrorMessage' \
            --output text > glue-error.txt

          if grep -qi "AccessDenied.*AssumeRole\|AssumeRole.*AccessDenied" glue-error.txt; then
            echo "Confirmed: Glue reported the expected AssumeRole AccessDenied."
            exit 0
          fi

          echo "The expected error was not confirmed in JobRun.ErrorMessage."
          echo "Inspect the CloudWatch output and error logs above."
          exit 1
