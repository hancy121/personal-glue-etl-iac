
name: Practice Capture AssumeRole Error

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  GLUE_JOB_NAME: practice-assume-role-job

jobs:
  diagnose-assume-role:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493272324412:role/github-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Identity and Glue Configuration
        run: |
          set -e

          echo "===== AWS IDENTITY ====="
          aws sts get-caller-identity

          echo "===== GLUE JOB CONFIGURATION ====="
          aws glue get-job \
            --job-name "$GLUE_JOB_NAME" \
            --region "$AWS_REGION" \
            --query 'Job.{Name:Name,Role:Role,Script:Command.ScriptLocation}' \
            --output json

      - name: Start Glue Job
        id: start
        run: |
          set -e

          JOB_RUN_ID=$(aws glue start-job-run \
            --job-name "$GLUE_JOB_NAME" \
            --region "$AWS_REGION" \
            --query 'JobRunId' \
            --output text)

          echo "JOB_RUN_ID=$JOB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Started run: $JOB_RUN_ID"

      - name: Wait for Glue Job
        id: wait
        env:
          JOB_RUN_ID: ${{ steps.start.outputs.JOB_RUN_ID }}
        run: |
          STATUS="UNKNOWN"

          for attempt in $(seq 1 90); do
            STATUS=$(aws glue get-job-run \
              --job-name "$GLUE_JOB_NAME" \
              --run-id "$JOB_RUN_ID" \
              --region "$AWS_REGION" \
              --query 'JobRun.JobRunState' \
              --output text)

            echo "Attempt $attempt: $STATUS"

            case "$STATUS" in
              SUCCEEDED|FAILED|TIMEOUT|STOPPED|ERROR|EXPIRED)
                break
                ;;
            esac

            sleep 10
          done

          echo "FINAL_STATUS=$STATUS" >> "$GITHUB_OUTPUT"

          if [[ "$STATUS" == "UNKNOWN" || "$STATUS" == "RUNNING" || "$STATUS" == "STARTING" ]]; then
            echo "Timed out waiting for a terminal Glue state."
            exit 1
          fi

      - name: Print Run Details
        if: always() && steps.start.outputs.JOB_RUN_ID != ''
        env:
          JOB_RUN_ID: ${{ steps.start.outputs.JOB_RUN_ID }}
        run: |
          echo "===== GLUE RUN DETAILS ====="

          aws glue get-job-run \
            --job-name "$GLUE_JOB_NAME" \
            --run-id "$JOB_RUN_ID" \
            --region "$AWS_REGION" \
            --query 'JobRun.{State:JobRunState,Error:ErrorMessage,LogGroup:LogGroupName,Started:StartedOn,Completed:CompletedOn}' \
            --output json

      - name: Search Glue CloudWatch Logs
        if: always() && steps.start.outputs.JOB_RUN_ID != ''
        run: |
          echo "===== SEARCHING /aws-glue/jobs ====="

          START_MS=$(( ($(date +%s) - 3600) * 1000 ))

          for PATTERN in \
            '"SCRIPT STARTED"' \
            '"SUCCESS"' \
            '"ASSUME ROLE FAILED"' \
            '"AccessDenied"' \
            '"PracticeAssumeRoleTest"'; do

            echo "===== PATTERN: $PATTERN ====="

            aws logs filter-log-events \
              --log-group-name "/aws-glue/jobs" \
              --region "$AWS_REGION" \
              --start-time "$START_MS" \
              --filter-pattern "$PATTERN" \
              --query 'events[].message' \
              --output text || true
          done

      - name: Report Result
        if: always() && steps.start.outputs.JOB_RUN_ID != ''
        env:
          FINAL_STATUS: ${{ steps.wait.outputs.FINAL_STATUS }}
        run: |
          echo "===== DIAGNOSTIC RESULT ====="
          echo "Glue status: $FINAL_STATUS"

          if [[ "$FINAL_STATUS" == "SUCCEEDED" ]]; then
            echo "Glue succeeded. Check the configured role and CloudWatch output to determine why AssumeRole was allowed."
          else
            echo "Glue did not succeed. Review the run details and CloudWatch messages above."
          fi
