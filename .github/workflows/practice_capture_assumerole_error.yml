
name: Practice Capture AssumeRole Error

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  GLUE_JOB_NAME: practice-assume-role-job

jobs:
  diagnose-assume-role:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493272324412:role/github-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity and Glue Configuration
        run: |
          set -e

          echo "===== AWS IDENTITY ====="
          aws sts get-caller-identity

          echo "===== GLUE JOB CONFIGURATION ====="
          aws glue get-job \
            --job-name "$GLUE_JOB_NAME" \
            --region "$AWS_REGION" \
            --query 'Job.{Name:Name,Role:Role,Script:Command.ScriptLocation,GlueVersion:GlueVersion}' \
            --output json

      - name: Discover CloudWatch Log Groups
        run: |
          set -e

          echo "===== AVAILABLE GLUE LOG GROUPS ====="

          aws logs describe-log-groups \
            --region "$AWS_REGION" \
            --query "logGroups[?contains(logGroupName, 'glue') || contains(logGroupName, 'Glue')].{Name:logGroupName,Created:creationTime}" \
            --output table

      - name: Start Glue Job
        id: start
        run: |
          set -e

          JOB_RUN_ID=$(aws glue start-job-run \
            --job-name "$GLUE_JOB_NAME" \
            --region "$AWS_REGION" \
            --query 'JobRunId' \
            --output text)

          if [[ -z "$JOB_RUN_ID" || "$JOB_RUN_ID" == "None" ]]; then
            echo "Failed to obtain Glue Job Run ID."
            exit 1
          fi

          echo "JOB_RUN_ID=$JOB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Started Glue job: $GLUE_JOB_NAME"
          echo "Job Run ID: $JOB_RUN_ID"

      - name: Wait for Glue Job
        id: wait
        env:
          JOB_RUN_ID: ${{ steps.start.outputs.JOB_RUN_ID }}
        run: |
          STATUS="UNKNOWN"

          for attempt in $(seq 1 90); do
            STATUS=$(aws glue get-job-run \
              --job-name "$GLUE_JOB_NAME" \
              --run-id "$JOB_RUN_ID" \
              --region "$AWS_REGION" \
              --query 'JobRun.JobRunState' \
              --output text)

            echo "Attempt $attempt: $STATUS"

            case "$STATUS" in
              SUCCEEDED|FAILED|TIMEOUT|STOPPED|ERROR|EXPIRED)
                break
                ;;
            esac

            sleep 10
          done

          echo "FINAL_STATUS=$STATUS" >> "$GITHUB_OUTPUT"

          case "$STATUS" in
            SUCCEEDED|FAILED|TIMEOUT|STOPPED|ERROR|EXPIRED)
              echo "Glue reached terminal state: $STATUS"
              ;;
            *)
              echo "Timed out waiting for Glue to finish."
              exit 1
              ;;
          esac

      - name: Print Glue Run Details
        if: always() && steps.start.outputs.JOB_RUN_ID != ''
        env:
          JOB_RUN_ID: ${{ steps.start.outputs.JOB_RUN_ID }}
        run: |
          echo "===== GLUE RUN DETAILS ====="

          aws glue get-job-run \
            --job-name "$GLUE_JOB_NAME" \
            --run-id "$JOB_RUN_ID" \
            --region "$AWS_REGION" \
            --query 'JobRun.{State:JobRunState,Error:ErrorMessage,LogGroup:LogGroupName,Started:StartedOn,Completed:CompletedOn,ExecutionTime:ExecutionTime}' \
            --output json

      - name: Search Discovered Glue Logs
        if: always() && steps.start.outputs.JOB_RUN_ID != ''
        env:
          JOB_RUN_ID: ${{ steps.start.outputs.JOB_RUN_ID }}
        run: |
          echo "===== SEARCHING GLUE LOGS ====="

          START_MS=$(( ($(date +%s) - 7200) * 1000 ))

          LOG_GROUPS=$(aws logs describe-log-groups \
            --region "$AWS_REGION" \
            --query "logGroups[?contains(logGroupName, 'glue') || contains(logGroupName, 'Glue')].logGroupName" \
            --output text)

          if [[ -z "$LOG_GROUPS" || "$LOG_GROUPS" == "None" ]]; then
            echo "No Glue-related CloudWatch log groups were found."
          else
            for LOG_GROUP in $LOG_GROUPS; do
              echo "===== LOG GROUP: $LOG_GROUP ====="

              for PATTERN in \
                '"SCRIPT STARTED"' \
                '"SUCCESS"' \
                '"ASSUME ROLE FAILED"' \
                '"AccessDenied"' \
                '"PracticeAssumeRoleTest"'; do

                echo "----- Pattern: $PATTERN -----"

                aws logs filter-log-events \
                  --log-group-name "$LOG_GROUP" \
                  --region "$AWS_REGION" \
                  --start-time "$START_MS" \
                  --filter-pattern "$PATTERN" \
                  --query 'events[].message' \
                  --output text || true
              done
            done
          fi

      - name: Report Result
        if: always() && steps.start.outputs.JOB_RUN_ID != ''
        env:
          FINAL_STATUS: ${{ steps.wait.outputs.FINAL_STATUS }}
        run: |
          echo "===== DIAGNOSTIC RESULT ====="
          echo "Glue status: $FINAL_STATUS"

          if [[ "$FINAL_STATUS" == "SUCCEEDED" ]]; then
            echo "Glue succeeded. Inspect the discovered logs to determine whether the AssumeRole test ran."
          else
            echo "Glue did not succeed. Inspect the run error and discovered logs."
          fi
