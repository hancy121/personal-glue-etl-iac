name: Create Glue IAM Role

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "493272324412"
  GITHUB_AWS_ROLE: github-ecr-role
  ROLE_NAME: practice-ea-pricing-models-lambda-role

jobs:
  create-role:
    runs-on: ubuntu-latest

    steps:

      - name: Debug context
        run: |
          echo "Repo: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.GITHUB_AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Identity
        run: |
          aws sts get-caller-identity

      # ---------------------------
      # CREATE TRUST POLICY FILE
      # ---------------------------
      - name: Create trust policy
        run: |
          cat <<EOF > trust-policy.json
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Service": "lambda.amazonaws.com"
                },
                "Action": "sts:AssumeRole"
              }
            ]
          }
          EOF

          cat trust-policy.json

      # ---------------------------
      # CREATE IAM ROLE
      # ---------------------------
      - name: Create IAM role
        run: |
          aws iam create-role \
            --role-name "$ROLE_NAME" \
            --assume-role-policy-document file://trust-policy.json \
            || echo "Role may already exist"

      # ---------------------------
      # ATTACH INLINE POLICY
      # ---------------------------
      - name: Attach permissions policy
        run: |
          cat <<EOF > policy.json
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "CloudWatchLogs",
                "Effect": "Allow",
                "Action": [
                  "logs:CreateLogGroup",
                  "logs:CreateLogStream",
                  "logs:PutLogEvents"
                ],
                "Resource": "*"
              },
              {
                "Sid": "ReadShapData",
                "Effect": "Allow",
                "Action": [
                  "s3:GetObject",
                  "s3:ListBucket"
                ],
                "Resource": "*"
              }
            ]
          }
          EOF

          cat policy.json

          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name glue-job-inline-policy \
            --policy-document file://policy.json

      # ---------------------------
      # VERIFY
      # ---------------------------
      - name: Verify role
        run: |
          echo "===== ROLE ====="

          aws iam get-role \
            --role-name "$ROLE_NAME"

          echo "===== INLINE POLICIES ====="

          aws iam list-role-policies \
            --role-name "$ROLE_NAME"

          echo "===== CREATE ROLE COMPLETE ====="
