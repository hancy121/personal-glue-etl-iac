name: Fix Practice AssumeRole Error

"on":
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  fix-assume-role:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493272324412:role/github-ecr-role
          aws-region: us-east-1

      - name: Verify AWS account
        shell: bash
        run: |
          set -e
          ACCOUNT=$(aws sts get-caller-identity \
            --query Account --output text)

          if [ "$ACCOUNT" != "493272324412" ]; then
            echo "Unexpected AWS account. Stopping."
            exit 1
          fi

          echo "Verified personal AWS account."

      - name: Restore AssumeRole permission
        shell: bash
        run: |
          set -e

          cat > policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "AssumePracticeTargetRole",
                "Effect": "Allow",
                "Action": "sts:AssumeRole",
                "Resource": "arn:aws:iam::493272324412:role/practice-redshift-s3-role"
              }
            ]
          }
          JSON

          aws iam put-role-policy \
            --role-name practice-glue-role \
            --policy-name PracticeAssumeTargetRole \
            --policy-document file://policy.json

          echo "AssumeRole permission restored."

      - name: Verify permission
        shell: bash
        run: |
          set -e

          aws iam get-role-policy \
            --role-name practice-glue-role \
            --policy-name PracticeAssumeTargetRole \
            --query 'Policy.Statement' \
            --output json

          echo "Permission verified."
