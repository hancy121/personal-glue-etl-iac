
name: Practice - Reproduce AssumeRole AccessDenied

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: "493272324412"
  ROLE_NAME: practice-glue-role
  POLICY_NAME: glue-job-inline-policy
  TARGET_ROLE: arn:aws:iam::493272324412:role/practice-redshift-s3-role

jobs:
  reproduce-error:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493272324412:role/github-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Personal AWS Account
        run: |
          ACCOUNT=$(aws sts get-caller-identity \
            --query Account --output text)

          echo "AWS account: $ACCOUNT"

          if [ "$ACCOUNT" != "$ACCOUNT_ID" ]; then
            echo "Wrong account. Stopping."
            exit 1
          fi

      - name: Remove Only the Test AssumeRole Permission
        run: |
          set -euo pipefail

          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --query PolicyDocument \
            --output json > existing-policy.json

          jq --arg target "$TARGET_ROLE" '
            .Statement |= map(
              select(
                !(
                  (
                    if (.Action | type) == "array"
                    then .Action
                    else [.Action]
                    end
                  ) | any(ascii_downcase == "sts:assumerole")
                )
                or
                (
                  (
                    if (.Resource | type) == "array"
                    then .Resource
                    else [.Resource]
                    end
                  ) | any(. == $target)
                )
              )
            )
          ' existing-policy.json > updated-policy.json

          echo "===== VERIFYING PERMISSION REMOVAL ====="

          if jq -e --arg target "$TARGET_ROLE" '
            any(.Statement[];
              (
                if (.Action | type) == "array"
                then .Action
                else [.Action]
                end
              ) | any(ascii_downcase == "sts:assumerole")
              and
              (
                if (.Resource | type) == "array"
                then .Resource
                else [.Resource]
                end
              ) | any(. == $target)
            )
          ' updated-policy.json >/dev/null; then
            echo "Target permission still exists. Stopping."
            exit 1
          fi

          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --policy-document file://updated-policy.json

          echo "Test AssumeRole permission removed."
          echo "Other policy statements were preserved."

      - name: Confirm Permission Is Missing
        run: |
          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --query PolicyDocument \
            --output json > verified-policy.json

          jq --arg target "$TARGET_ROLE" '
            [
              .Statement[] |
              select(
                (
                  if (.Action | type) == "array"
                  then .Action
                  else [.Action]
                  end
                ) | any(ascii_downcase == "sts:assumerole")
              ) |
              select(
                (
                  if (.Resource | type) == "array"
                  then .Resource
                  else [.Resource]
                  end
                ) | any(. == $target)
              )
            ]
          ' verified-policy.json
