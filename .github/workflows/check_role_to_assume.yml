name: Add IAM Permissions (Non-Destructive)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update_iam_role_permissions.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ROLE_NAME: practice-traffic-shap-agent-role

jobs:
  update-role:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 🟢 Practice GitHub Actions/OIDC role
          role-to-assume: arn:aws:iam::493272324412:role/github-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Identity
        run: aws sts get-caller-identity

      # ---------------------------
      # GET EXISTING INLINE POLICY
      # ---------------------------
      - name: Fetch existing policy
        run: |
          aws iam get-role-policy \
            --role-name $ROLE_NAME \
            --policy-name glue-job-inline-policy \
            --query 'PolicyDocument' \
            --output json > existing-policy.json || echo '{}' > existing-policy.json

          cat existing-policy.json

      # ---------------------------
      # APPEND NEW PERMISSIONS
      # ---------------------------
      - name: Append permissions
        run: |
          cat <<EOF > new-permission.json
          [
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:ListBucket"
              ],
              "Resource": [
                "arn:aws:s3:::practice-analytics-ea-ds-dev",
                "arn:aws:s3:::practice-analytics-ea-ds-dev/*"
              ]
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:ListBucket"
              ],
              "Resource": [
                "arn:aws:s3:::practice-analytics-ea-ds-pricing",
                "arn:aws:s3:::practice-analytics-ea-ds-pricing/*"
              ]
            },
            {
              "Effect": "Allow",
              "Action": [
                "lambda:InvokeFunction"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject"
              ],
              "Resource": "arn:aws:s3:::practice-analytics-ea-ds-pricing/ELASTICITY/*"
            }
          ]
          EOF

          jq '
            if .Statement == null then
              {
                Version: "2012-10-17",
                Statement: input
              }
            else
              .Statement += input
            end
          ' existing-policy.json new-permission.json > updated-policy.json

          echo "===== UPDATED POLICY ====="
          cat updated-policy.json

          aws iam put-role-policy \
            --role-name $ROLE_NAME \
            --policy-name glue-job-inline-policy \
            --policy-document file://updated-policy.json

      - name: Done
        run: echo "Added permissions without modifying trust relationships"
