name: Add Permissions & Trust

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "493272324412"
  GITHUB_AWS_ROLE: github-ecr-role
  ROLE_NAME: practice-glue-lambda-role

jobs:
  update-role:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.GITHUB_AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Identity
        run: |
          aws sts get-caller-identity

      # ---------------------------
      # GET EXISTING TRUST POLICY
      # ---------------------------
      - name: Fetch existing trust policy
        run: |
          aws iam get-role \
            --role-name "$ROLE_NAME" \
            --query 'AssumeRolePolicyDocument' \
            --output json > existing-trust.json

          echo "===== EXISTING TRUST ====="
          cat existing-trust.json

      # ---------------------------
      # ADD SAGEMAKER TRUST
      # ---------------------------
      - name: Add SageMaker trust
        run: |
          cat > new-trust-entry.json <<'EOF'
          {
            "Effect": "Allow",
            "Principal": {
              "Service": "sagemaker.amazonaws.com"
            },
            "Action": "sts:AssumeRole"
          }
          EOF

          jq '
            if any(.Statement[]?; .Principal.Service == "sagemaker.amazonaws.com") then
              .
            else
              .Statement += [input]
            end
          ' existing-trust.json new-trust-entry.json > updated-trust.json

          echo "===== UPDATED TRUST ====="
          cat updated-trust.json

          aws iam update-assume-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-document file://updated-trust.json

      # ---------------------------
      # GET EXISTING INLINE POLICY
      # ---------------------------
      - name: Fetch existing policy
        run: |
          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name glue-job-inline-policy \
            --query 'PolicyDocument' \
            --output json > existing-policy.json

          echo "===== EXISTING POLICY ====="
          cat existing-policy.json

      # ---------------------------
      # ADD S3 PERMISSIONS
      # ---------------------------
      - name: Append permissions
        run: |
          cat > new-permission.json <<'EOF'
          [
            {
              "Effect": "Allow",
              "Action": [
                "s3:ListBucket"
              ],
              "Resource": "arn:aws:s3:::practice-sagemaker-bucket"
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:PutObject",
                "s3:DeleteObject"
              ],
              "Resource": "arn:aws:s3:::practice-sagemaker-bucket/*"
            }
          ]
          EOF

          jq '
            if .Statement == null then
              {
                Version: "2012-10-17",
                Statement: input
              }
            else
              .Statement += input
            end
          ' existing-policy.json new-permission.json > updated-policy.json

          echo "===== UPDATED POLICY ====="
          cat updated-policy.json

          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name glue-job-inline-policy \
            --policy-document file://updated-policy.json

      - name: Done
        run: |
          echo "Added SageMaker trust and S3 permissions."
