name: Add Permissions & Trust (Non-Destructive)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "493272324412"
  GITHUB_AWS_ROLE: github-ecr-role

  # Practice role we are updating
  ROLE_NAME: practice-ea-pricing-models-lambda-role

jobs:
  update-role:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------
      # Checkout repository
      # ---------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------
      # Configure AWS Credentials
      # ---------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.GITHUB_AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------------
      # Verify AWS Identity
      # ---------------------------------
      - name: Verify Identity
        run: |
          aws sts get-caller-identity

      # ---------------------------------
      # GET EXISTING TRUST POLICY
      # ---------------------------------
      - name: Fetch Existing Trust Policy
        run: |
          aws iam get-role \
            --role-name "$ROLE_NAME" \
            --query 'Role.AssumeRolePolicyDocument' \
            --output json > existing-trust.json

          echo "===== EXISTING TRUST POLICY ====="
          cat existing-trust.json

      # ---------------------------------
      # ADD SAGEMAKER TRUST
      # ---------------------------------
      - name: Append SageMaker Trust Relationship
        run: |
          cat > new-trust-entry.json <<'EOF'
          {
            "Effect": "Allow",
            "Principal": {
              "Service": "sagemaker.amazonaws.com"
            },
            "Action": "sts:AssumeRole"
          }
          EOF

          jq '
            if .Statement == null then
              {
                Version: "2012-10-17",
                Statement: [input]
              }
            elif any(.Statement[]; .Principal.Service? == "sagemaker.amazonaws.com") then
              .
            else
              .Statement += [input]
            end
          ' existing-trust.json new-trust-entry.json > updated-trust.json

          echo "===== UPDATED TRUST POLICY ====="
          cat updated-trust.json

      # ---------------------------------
      # APPLY UPDATED TRUST POLICY
      # ---------------------------------
      - name: Update Trust Relationship
        run: |
          aws iam update-assume-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-document file://updated-trust.json

          echo "Trust relationship updated successfully."

      # ---------------------------------
      # GET EXISTING INLINE POLICY
      # ---------------------------------
      - name: Fetch Existing Inline Policy
        run: |
          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name glue-job-inline-policy \
            --query 'PolicyDocument' \
            --output json > existing-policy.json || echo '{}' > existing-policy.json

          echo "===== EXISTING INLINE POLICY ====="
          cat existing-policy.json

      # ---------------------------------
      # ADD S3 PERMISSIONS
      # ---------------------------------
      - name: Append S3 Permissions
        run: |
          cat > new-permission.json <<'EOF'
          [
            {
              "Effect": "Allow",
              "Action": [
                "s3:ListBucket"
              ],
              "Resource": "arn:aws:s3:::sagemaker-us-east-2-493272324412"
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:PutObject",
                "s3:DeleteObject"
              ],
              "Resource": "arn:aws:s3:::sagemaker-us-east-2-493272324412/*"
            }
          ]
          EOF

          jq '
            if .Statement == null then
              {
                Version: "2012-10-17",
                Statement: input
              }
            else
              .Statement += input
            end
          ' existing-policy.json new-permission.json > updated-policy.json

          echo "===== UPDATED INLINE POLICY ====="
          cat updated-policy.json

      # ---------------------------------
      # APPLY UPDATED INLINE POLICY
      # ---------------------------------
      - name: Update Inline Policy
        run: |
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name glue-job-inline-policy \
            --policy-document file://updated-policy.json

          echo "Inline policy updated successfully."

      # ---------------------------------
      # FINAL VERIFICATION
      # ---------------------------------
      - name: Verify Final IAM Configuration
        run: |
          echo "======================================"
          echo "FINAL TRUST POLICY"
          echo "======================================"

          aws iam get-role \
            --role-name "$ROLE_NAME" \
            --query 'Role.AssumeRolePolicyDocument' \
            --output json

          echo "======================================"
          echo "FINAL INLINE POLICY"
          echo "======================================"

          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name glue-job-inline-policy \
            --query 'PolicyDocument' \
            --output json

          echo "======================================"
          echo "IAM ROLE UPDATE COMPLETE"
          echo "======================================"
