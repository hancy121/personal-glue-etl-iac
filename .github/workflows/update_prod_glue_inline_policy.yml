
name: Practice - Update Glue Inline Policy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/practice_update_glue_inline_policy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: "493272324412"
  ROLE_NAME: practice-glue-role
  POLICY_NAME: glue-job-inline-policy

jobs:
  update-glue-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493272324412:role/github-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Personal AWS Account
        run: |
          ACCOUNT=$(aws sts get-caller-identity \
            --query Account --output text)

          echo "Connected AWS account: $ACCOUNT"

          if [ "$ACCOUNT" != "$ACCOUNT_ID" ]; then
            echo "ERROR: Wrong AWS account. Stopping."
            exit 1
          fi

      - name: Fetch Existing Inline Policy
        run: |
          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --query PolicyDocument \
            --output json > existing-policy.json

      - name: Merge Production-Style Permissions
        run: |
          cat > new-statements.json <<'EOF'
          [
            {
              "Sid": "ListAnalyticsBuckets",
              "Effect": "Allow",
              "Action": "s3:ListBucket",
              "Resource": [
                "arn:aws:s3:::analytics-ea-ds-dev",
                "arn:aws:s3:::analytics-ea-ds-pricing"
              ]
            },
            {
              "Sid": "ReadAnalyticsObjects",
              "Effect": "Allow",
              "Action": "s3:GetObject",
              "Resource": [
                "arn:aws:s3:::analytics-ea-ds-dev/*",
                "arn:aws:s3:::analytics-ea-ds-pricing/*"
              ]
            },
            {
              "Sid": "InvokeLambda",
              "Effect": "Allow",
              "Action": "lambda:InvokeFunction",
              "Resource": "*"
            },
            {
              "Sid": "ReadElasticityObjects",
              "Effect": "Allow",
              "Action": "s3:GetObject",
              "Resource": "arn:aws:s3:::analytics-ea-ds-pricing/ELASTICITY/*"
            }
          ]
          EOF

          jq --slurpfile additions new-statements.json '
            .Statement = (
              .Statement +
              [
                $additions[0][] as $new |
                select(
                  ([.Statement[] | .Sid // ""] | index($new.Sid)) == null
                ) |
                $new
              ]
            )
          ' existing-policy.json > updated-policy.json

          echo "===== REVIEW UPDATED POLICY ====="
          cat updated-policy.json

      - name: Update Existing Inline Policy
        run: |
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --policy-document file://updated-policy.json

      - name: Verify Updated Policy
        run: |
          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --query PolicyDocument \
            --output json
