name: Update Test IAM Role Permissions

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "493272324412"
  DEPLOYMENT_ROLE: github-ecr-role
  TEST_ROLE_NAME: practice-glue-lambda-role

jobs:
  update-role:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOYMENT_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          echo "Connected to AWS:"
          aws sts get-caller-identity

      - name: Check existing role
        run: |
          echo "Checking existing role..."

          aws iam get-role \
            --role-name "$TEST_ROLE_NAME"

      - name: Add missing permissions
        shell: bash
        run: |
          set -e

          cat > updated-glue-job-inline-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "logs:CreateLogGroup",
                  "logs:CreateLogStream",
                  "logs:PutLogEvents"
                ],
                "Resource": "*"
              },
              {
                "Effect": "Allow",
                "Action": [
                  "s3:GetObject",
                  "s3:ListBucket",
                  "s3:PutObject",
                  "s3:DeleteObject"
                ],
                "Resource": "*"
              },
              {
                "Effect": "Allow",
                "Action": [
                  "lambda:InvokeFunction"
                ],
                "Resource": "*"
              }
            ]
          }
          EOF

          echo "Updating permissions for:"
          echo "$TEST_ROLE_NAME"

          aws iam put-role-policy \
            --role-name "$TEST_ROLE_NAME" \
            --policy-name glue-job-inline-policy \
            --policy-document file://updated-glue-job-inline-policy.json

          echo "Permissions updated successfully."

      - name: Verify updated role
        run: |
          echo "=== Role ==="

          aws iam get-role \
            --role-name "$TEST_ROLE_NAME"

          echo "=== Inline Policies ==="

          aws iam list-role-policies \
            --role-name "$TEST_ROLE_NAME"

          echo "Update completed successfully."
