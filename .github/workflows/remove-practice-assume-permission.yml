name: Remove Practice AssumeRole Permission

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  remove-permission:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Authenticate to your personal AWS account
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493272324412:role/github-ecr-role
          aws-region: us-east-1

      # Step 2: Verify the account and remove the permission
      - name: Verify account and remove permission
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "Connected AWS account: $ACCOUNT"

          if [ "$ACCOUNT" != "493272324412" ]; then
            echo "ERROR: Wrong AWS account. Stopping."
            exit 1
          fi

          ROLE_NAME="practice-glue-role"
          POLICY_NAME="PracticeAssumeTargetRole"

          echo "Checking whether the inline policy exists..."

          if aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            >/dev/null 2>&1; then

            echo "Policy found. Removing permission..."

            aws iam delete-role-policy \
              --role-name "$ROLE_NAME" \
              --policy-name "$POLICY_NAME"

            echo "Delete command completed."

          else
            echo "Policy is already absent. No deletion required."
          fi

          # Step 3: Verify the policy is absent
          echo "Verifying policy removal..."

          if aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            >/dev/null 2>&1; then

            echo "ERROR: Policy still exists."
            exit 1
          else
            echo "SUCCESS: AssumeRole permission policy is absent."
          fi
