name: Remove Practice AssumeRole Permission

"on":
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  remove-permission:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493272324412:role/github-ecr-role
          aws-region: us-east-1

      - name: Verify account and remove permission
        shell: bash
        run: |
          set -e

          ACCOUNT=$(aws sts get-caller-identity \
            --query Account --output text)

          if [ "$ACCOUNT" != "493272324412" ]; then
            echo "Wrong AWS account. Stopping."
            exit 1
          fi

          aws iam delete-role-policy \
            --role-name practice-glue-role \
            --policy-name PracticeAssumeTargetRole

          echo "Removed PracticeAssumeTargetRole."

          if aws iam get-role-policy \
            --role-name practice-glue-role \
            --policy-name PracticeAssumeTargetRole >/dev/null 2>&1; then
            echo "ERROR: Permission policy still exists."
            exit 1
          fi

          echo "Verified: AssumeRole permission policy is absent."
