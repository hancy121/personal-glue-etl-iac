
name: Update Personal Glue IAM Permissions

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update_iam_role_permissions.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

  # Aditya: source account
  ACCOUNT_ID: "493272324412"
  GLUE_ROLE_NAME: glue-assumerole-test-source
  POLICY_NAME: glue-job-inline-policy
  GLUE_ROLE_ARN: arn:aws:iam::493272324412:role/glue-assumerole-test-source

  # Hancy: target account
  TARGET_ACCOUNT_ID: "784656681846"
  TARGET_ROLE_ARN: arn:aws:iam::784656681846:role/redshift-assumerole-test-target

jobs:
  update-role:
    runs-on: ubuntu-latest

    steps:
      # 1. Authenticate to Aditya's AWS account using GitHub OIDC
      - name: Configure Personal AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493272324412:role/github-ecr-role
          role-session-name: GitHubPersonalGlueTest
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: "493272324412"

      # 2. Verify authentication
      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          ACCOUNT=$(aws sts get-caller-identity \
            --query Account --output text)

          if [ "$ACCOUNT" != "$ACCOUNT_ID" ]; then
            echo "ERROR: Expected account $ACCOUNT_ID, got $ACCOUNT"
            exit 1
          fi

          echo "GitHub OIDC authentication succeeded."

      # 3. Retrieve existing policy without masking permission errors
      - name: Fetch Existing Inline Policy
        shell: bash
        run: |
          set -euo pipefail

          if aws iam get-role-policy \
            --role-name "$GLUE_ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --query PolicyDocument \
            --output json > existing-policy.json 2>policy-error.txt; then

            jq -e '
              .Version == "2012-10-17" and
              (.Statement | type == "array" or type == "object")
            ' existing-policy.json >/dev/null

            jq '
              .Statement |= (
                if type == "array" then .
                elif type == "object" then [.]
                else error("Invalid Statement")
                end
              )
            ' existing-policy.json > normalized-policy.json

            mv normalized-policy.json existing-policy.json

          elif grep -q "NoSuchEntity" policy-error.txt; then
            printf '%s\n' \
              '{"Version":"2012-10-17","Statement":[]}' \
              > existing-policy.json
          else
            cat policy-error.txt
            echo "ERROR: Unable to read the existing inline policy."
            exit 1
          fi

      # 4. Add only the required cross-account permission
      - name: Build Updated Policy
        shell: bash
        run: |
          set -euo pipefail

          jq --arg target "$TARGET_ROLE_ARN" '
            .Statement = (
              [
                .Statement[]
                | select(
                    .Sid != "AllowHancyTargetRoleAssumption"
                  )
              ]
              + [
                  {
                    "Sid": "AllowHancyTargetRoleAssumption",
                    "Effect": "Allow",
                    "Action": "sts:AssumeRole",
                    "Resource": $target
                  }
                ]
            )
          ' existing-policy.json > updated-policy.json

          jq -e --arg target "$TARGET_ROLE_ARN" '
            any(.Statement[];
              .Sid == "AllowHancyTargetRoleAssumption" and
              .Effect == "Allow" and
              .Action == "sts:AssumeRole" and
              .Resource == $target
            )
          ' updated-policy.json >/dev/null

          echo "Updated policy prepared."
          jq . updated-policy.json

      # 5. Apply the policy to Aditya's source Glue role
      - name: Apply Updated Inline Policy
        shell: bash
        run: |
          set -euo pipefail

          aws iam put-role-policy \
            --role-name "$GLUE_ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --policy-document file://updated-policy.json

          echo "Source role policy updated."

      # 6. Verify the saved policy
      - name: Verify Applied Permission
        shell: bash
        run: |
          set -euo pipefail

          aws iam get-role-policy \
            --role-name "$GLUE_ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --query PolicyDocument \
            --output json > applied-policy.json

          jq -e --arg target "$TARGET_ROLE_ARN" '
            any(.Statement[];
              .Sid == "AllowHancyTargetRoleAssumption" and
              .Effect == "Allow" and
              .Action == "sts:AssumeRole" and
              .Resource == $target
            )
          ' applied-policy.json >/dev/null

          echo "Source role permission verified."

      # 7. Assume Aditya's source Glue role
      - name: Assume Source Glue Role
        shell: bash
        run: |
          set -euo pipefail

          CREDS=$(aws sts assume-role \
            --role-arn "$GLUE_ROLE_ARN" \
            --role-session-name PersonalGlueSourceTest \
            --query Credentials \
            --output json)

          {
            echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.AccessKeyId')"
            echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.SecretAccessKey')"
            echo "AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.SessionToken')"
          } >> "$GITHUB_ENV"

          echo "Source Glue role assumed."

      # 8. Test assumption of Hancy's target role
      - name: Test Cross-Account AssumeRole
        shell: bash
        run: |
          set -euo pipefail

          CREDS=$(aws sts assume-role \
            --role-arn "$TARGET_ROLE_ARN" \
            --role-session-name PersonalCrossAccountTest \
            --query Credentials \
            --output json)

          {
            echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.AccessKeyId')"
            echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.SecretAccessKey')"
            echo "AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.SessionToken')"
          } >> "$GITHUB_ENV"

          echo "Cross-account role assumption succeeded."

      # 9. Verify the target identity
      - name: Verify Target Role Identity
        shell: bash
        run: |
          set -euo pipefail

          IDENTITY=$(aws sts get-caller-identity)
          echo "$IDENTITY"

          ACCOUNT=$(echo "$IDENTITY" | jq -r '.Account')
          ARN=$(echo "$IDENTITY" | jq -r '.Arn')

          if [ "$ACCOUNT" != "$TARGET_ACCOUNT_ID" ]; then
            echo "ERROR: Expected target account $TARGET_ACCOUNT_ID"
            exit 1
          fi

          case "$ARN" in
            arn:aws:sts::784656681846:assumed-role/redshift-assumerole-test-target/*)
              echo "SUCCESS: Cross-account assumption verified."
              ;;
            *)
              echo "ERROR: Unexpected assumed role: $ARN"
              exit 1
              ;;
          esac

