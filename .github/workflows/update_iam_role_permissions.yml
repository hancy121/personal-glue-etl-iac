name: Update Personal Glue IAM Permissions

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update_iam_role_permissions.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: "493272324412"
  ROLE_NAME: practice-glue-role
  POLICY_NAME: glue-job-inline-policy
  TARGET_ROLE_ARN: arn:aws:iam::493272324412:role/practice-redshift-s3-role

jobs:
  update-role:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Personal AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493272324412:role/github-ecr-role
          aws-region: us-east-1

      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT=$(aws sts get-caller-identity \
            --query Account --output text)

          if [ "$ACCOUNT" != "$ACCOUNT_ID" ]; then
            echo "ERROR: Unexpected AWS account: $ACCOUNT"
            exit 1
          fi

          echo "Verified personal AWS account: $ACCOUNT"

      - name: Fetch Existing Inline Policy
        shell: bash
        run: |
          set -euo pipefail

          if aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --query PolicyDocument \
            --output json > existing-policy.json 2>/dev/null; then

            jq -e '
              .Version == "2012-10-17" and
              (.Statement | type == "array")
            ' existing-policy.json >/dev/null

            echo "Existing inline policy retrieved."
          else
            echo "Policy does not exist. Creating an empty policy document."
            printf '%s\n' \
              '{"Version":"2012-10-17","Statement":[]}' \
              > existing-policy.json
          fi

      - name: Remove AssumeRole Permission
        shell: bash
        run: |
          set -euo pipefail

          # Preserve unrelated permissions.
          # Remove the managed AssumeRole statement and any other
          # Allow statement granting sts:AssumeRole on the target role.
          jq --arg target "$TARGET_ROLE_ARN" '
            .Statement = [
              .Statement[]
              | select(
                  (
                    .Sid // ""
                  ) != "AssumePracticeTargetRole"
                  and
                  (
                    .Effect != "Allow"
                    or
                    (
                      (
                        if (.Action | type) == "array"
                        then .Action
                        else [.Action]
                        end
                      )
                      | map(ascii_downcase)
                      | index("sts:assumerole")
                    ) == null
                    or
                    (
                      (
                        if (.Resource | type) == "array"
                        then .Resource
                        else [.Resource]
                        end
                      )
                      | index($target)
                    ) == null
                  )
                )
            ]
          ' existing-policy.json > updated-policy.json

          echo "===== UPDATED POLICY ====="
          jq . updated-policy.json

          if jq -e --arg target "$TARGET_ROLE_ARN" '
            any(.Statement[];
              .Effect == "Allow" and
              (
                if (.Action | type) == "array"
                then .Action
                else [.Action]
                end
                | map(ascii_downcase)
                | index("sts:assumerole")
              ) != null and
              (
                if (.Resource | type) == "array"
                then .Resource
                else [.Resource]
                end
                | index($target)
              ) != null
            )
          ' updated-policy.json >/dev/null; then
            echo "ERROR: An AssumeRole grant to the target remains."
            exit 1
          fi

          echo "Verified: No matching AssumeRole Allow statement remains in this inline policy."

      - name: Apply Updated Inline Policy
        shell: bash
        run: |
          set -euo pipefail

          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --policy-document file://updated-policy.json

          echo "Inline policy updated."

      - name: Verify Applied Policy
        shell: bash
        run: |
          set -euo pipefail

          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "$POLICY_NAME" \
            --query PolicyDocument \
            --output json > applied-policy.json

          if jq -e --arg target "$TARGET_ROLE_ARN" '
            any(.Statement[];
              .Effect == "Allow" and
              (
                if (.Action | type) == "array"
                then .Action
                else [.Action]
                end
                | map(ascii_downcase)
                | index("sts:assumerole")
              ) != null and
              (
                if (.Resource | type) == "array"
                then .Resource
                else [.Resource]
                end
                | index($target)
              ) != null
            )
          ' applied-policy.json >/dev/null; then
            echo "ERROR: AssumeRole permission still exists in this inline policy."
            exit 1
          fi

          echo "SUCCESS: No matching AssumeRole Allow statement exists in glue-job-inline-policy."
