name: Practice Add AssumeRole Permission

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ROLE_NAME: practice-glue-role

jobs:
  update-role:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493272324412:role/github-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          echo "===== AWS IDENTITY ====="
          aws sts get-caller-identity

      - name: Fetch existing policy
        run: |
          echo "===== EXISTING POLICY ====="

          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name glue-job-inline-policy \
            --query 'PolicyDocument' \
            --output json > existing-policy.json

          cat existing-policy.json

      - name: Create AssumeRole permission
        run: |
          echo "===== NEW PERMISSION ====="

          cat <<EOF > new-permission.json
          [
            {
              "Effect": "Allow",
              "Action": [
                "sts:AssumeRole"
              ],
              "Resource": "arn:aws:iam::493272324412:role/practice-redshift-s3-role"
            }
          ]
          EOF

          cat new-permission.json

      - name: Build updated policy
        run: |
          echo "===== BUILDING UPDATED POLICY ====="

          jq '
            if .Statement == null then
              {
                Version: "2012-10-17",
                Statement: input
              }
            else
              .Statement += input
            end
          ' existing-policy.json new-permission.json > updated-policy.json

          echo "===== UPDATED POLICY ====="
          cat updated-policy.json

      - name: Update IAM role policy
        run: |
          echo "===== UPDATING IAM ROLE ====="

          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name glue-job-inline-policy \
            --policy-document file://updated-policy.json

          echo "IAM role policy updated successfully."

      - name: Verify AssumeRole permission
        run: |
          echo "===== VERIFYING ASSUMEROLE PERMISSION ====="

          aws iam get-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name glue-job-inline-policy \
            --query 'PolicyDocument.Statement[?contains(Action, `sts:AssumeRole`)]' \
            --output json

      - name: Done
        run: |
          echo "=========================================="
          echo "AssumeRole permission added successfully."
          echo "Source role:"
          echo "$ROLE_NAME"
          echo ""
          echo "Target role:"
          echo "arn:aws:iam::493272324412:role/practice-redshift-s3-role"
          echo "=========================================="
