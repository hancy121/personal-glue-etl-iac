
name: Practice - Run Glue Job

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  GLUE_JOB_NAME: practice-assume-role-job

jobs:
  run-glue-job:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493272324412:role/github-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Account
        run: |
          aws sts get-caller-identity

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account --output text)

          if [ "$ACCOUNT_ID" != "493272324412" ]; then
            echo "Unexpected AWS account. Stopping."
            exit 1
          fi

      - name: Verify Glue Job Exists
        run: |
          aws glue get-job \
            --job-name "$GLUE_JOB_NAME"

      - name: Start Glue Job
        id: start
        run: |
          JOB_RUN_ID=$(aws glue start-job-run \
            --job-name "$GLUE_JOB_NAME" \
            --query JobRunId \
            --output text)

          echo "JOB_RUN_ID=$JOB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Started Glue job: $GLUE_JOB_NAME"
          echo "Job run ID: $JOB_RUN_ID"

      - name: Wait for Glue Job
        env:
          JOB_RUN_ID: ${{ steps.start.outputs.JOB_RUN_ID }}
        run: |
          while true; do
            STATE=$(aws glue get-job-run \
              --job-name "$GLUE_JOB_NAME" \
              --run-id "$JOB_RUN_ID" \
              --query 'JobRun.JobRunState' \
              --output text)

            echo "Glue job state: $STATE"

            case "$STATE" in
              SUCCEEDED)
                echo "Glue job completed successfully."
                break
                ;;
              FAILED|TIMEOUT|ERROR|STOPPED|EXPIRED)
                echo "Glue job finished unsuccessfully."
                aws glue get-job-run \
                  --job-name "$GLUE_JOB_NAME" \
                  --run-id "$JOB_RUN_ID" \
                  --query 'JobRun.{State:JobRunState,Error:ErrorMessage}' \
                  --output json
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done
