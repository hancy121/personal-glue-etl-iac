
name: Configure Glue and Redshift Cross-Account Access

on:
  workflow_dispatch:
  push:
    branches:
      - EA-Fleet-Analysis-Deploy-1
    paths:
      - ".github/workflows/update_iam_role_permissions.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2

  # Glue account
  SOURCE_ACCOUNT_ID: "654654263141"
  GLUE_ROLE_NAME: AmazonSageMakerServiceCatalogProductsGlueRole
  GLUE_POLICY_NAME: glue-job-inline-policy
  GLUE_ROLE_ARN: arn:aws:iam::654654263141:role/AmazonSageMakerServiceCatalogProductsGlueRole

  # New Redshift role
  TARGET_ACCOUNT_ID: "604349250746"
  REDSHIFT_ROLE_NAME: signet-role-Glue-To-Redshift
  REDSHIFT_ROLE_ARN: arn:aws:iam::604349250746:role/signet-role-Glue-To-Redshift

  # Replace with a real deployment role in the target account.
  TARGET_DEPLOYMENT_ROLE_ARN: REPLACE_WITH_TARGET_DEPLOYMENT_ROLE_ARN

jobs:
  configure-cross-account-access:
    name: Configure Both IAM Permissions
    environment: prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # STEP 1: Authenticate to the Glue account.
      - name: Configure Source AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::654654263141:role/signet-gha-eadse-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Source Account
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          test "$ACCOUNT" = "$SOURCE_ACCOUNT_ID" || {
            echo "ERROR: Unexpected source account: $ACCOUNT"
            exit 1
          }

      # STEP 2: Add sts:AssumeRole to the Glue identity policy.
      # Existing S3, Lambda, and other permissions are preserved.
      - name: Add Missing Glue AssumeRole Permission
        shell: bash
        run: |
          set -euo pipefail

          aws iam get-role-policy \
            --role-name "$GLUE_ROLE_NAME" \
            --policy-name "$GLUE_POLICY_NAME" \
            --query PolicyDocument \
            --output json > glue-policy.json

          jq -e '
            .Version == "2012-10-17" and
            has("Statement")
          ' glue-policy.json >/dev/null

          jq --arg target "$REDSHIFT_ROLE_ARN" '
            .Statement = (
              (if (.Statement | type) == "array"
               then .Statement else [.Statement] end)
              | if any(.[];
                  .Effect == "Allow" and
                  (
                    .Action == "sts:AssumeRole" or
                    ((.Action | type) == "array" and
                     (.Action | index("sts:AssumeRole")) != null)
                  ) and
                  (
                    .Resource == $target or
                    ((.Resource | type) == "array" and
                     (.Resource | index($target)) != null)
                  )
                )
                then .
                else . + [{
                  "Sid": "AllowAssumeNewRedshiftRole",
                  "Effect": "Allow",
                  "Action": "sts:AssumeRole",
                  "Resource": $target
                }]
                end
            )
          ' glue-policy.json > updated-glue-policy.json

          aws iam put-role-policy \
            --role-name "$GLUE_ROLE_NAME" \
            --policy-name "$GLUE_POLICY_NAME" \
            --policy-document file://updated-glue-policy.json

          echo "Glue identity policy updated."

      # STEP 3: Switch to an authorized deployment role in the
      # Redshift account. The source OIDC role must be allowed
      # to assume this role.
      - name: Configure Target Account Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TARGET_DEPLOYMENT_ROLE_ARN }}
          role-chaining: true
          role-session-name: UpdateRedshiftTrust
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Target Account
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          test "$ACCOUNT" = "$TARGET_ACCOUNT_ID" || {
            echo "ERROR: Unexpected target account: $ACCOUNT"
            exit 1
          }

      # STEP 4: Add the Glue role to the Redshift trust policy.
      # Existing trust statements are preserved.
      - name: Fetch Existing Redshift Trust Policy
        shell: bash
        run: |
          set -euo pipefail

          aws iam get-role \
            --role-name "$REDSHIFT_ROLE_NAME" \
            --query Role.AssumeRolePolicyDocument \
            --output json > redshift-trust.json

          jq -e '
            .Version == "2012-10-17" and
            has("Statement")
          ' redshift-trust.json >/dev/null

      - name: Add Missing Glue Trust
        shell: bash
        run: |
          set -euo pipefail

          jq --arg glue "$GLUE_ROLE_ARN" '
            .Statement = (
              (if (.Statement | type) == "array"
               then .Statement else [.Statement] end)
              | if any(.[];
                  .Effect == "Allow" and
                  (
                    .Action == "sts:AssumeRole" or
                    ((.Action | type) == "array" and
                     (.Action | index("sts:AssumeRole")) != null)
                  ) and
                  (
                    .Principal.AWS == $glue or
                    ((.Principal.AWS | type) == "array" and
                     (.Principal.AWS | index($glue)) != null)
                  )
                )
                then .
                else . + [{
                  "Sid": "AllowProductionGlueJob",
                  "Effect": "Allow",
                  "Principal": {"AWS": $glue},
                  "Action": "sts:AssumeRole"
                }]
                end
            )
          ' redshift-trust.json > updated-redshift-trust.json

          aws iam update-assume-role-policy \
            --role-name "$REDSHIFT_ROLE_NAME" \
            --policy-document file://updated-redshift-trust.json

          echo "Redshift trust policy updated."

      # STEP 5: Verify the Redshift trust change.
      - name: Verify Redshift Trust
        shell: bash
        run: |
          set -euo pipefail

          aws iam get-role \
            --role-name "$REDSHIFT_ROLE_NAME" \
            --query Role.AssumeRolePolicyDocument \
            --output json > verified-trust.json

          jq -e --arg glue "$GLUE_ROLE_ARN" '
            any(
              (if (.Statement | type) == "array"
               then .Statement else [.Statement] end)[];
              .Effect == "Allow" and
              (
                .Action == "sts:AssumeRole" or
                ((.Action | type) == "array" and
                 (.Action | index("sts:AssumeRole")) != null)
              ) and
              (
                .Principal.AWS == $glue or
                ((.Principal.AWS | type) == "array" and
                 (.Principal.AWS | index($glue)) != null)
              )
            )
          ' verified-trust.json >/dev/null

          echo "SUCCESS: Both IAM changes have been applied."
