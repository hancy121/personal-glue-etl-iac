
name: Configure Glue and Redshift Access

on:
  workflow_dispatch:
  push:
    branches:
      - EA-Fleet-Analysis-Deploy-1
    paths:
      - ".github/workflows/update_iam_role_permissions.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  SOURCE_ACCOUNT_ID: "654654263141"
  TARGET_ACCOUNT_ID: "604349250746"

  GLUE_ROLE_NAME: AmazonSageMakerServiceCatalogProductsGlueRole
  GLUE_POLICY_NAME: glue-job-inline-policy
  GLUE_ROLE_ARN: arn:aws:iam::654654263141:role/AmazonSageMakerServiceCatalogProductsGlueRole

  REDSHIFT_ROLE_NAME: signet-role-Glue-To-Redshift
  REDSHIFT_ROLE_ARN: arn:aws:iam::604349250746:role/signet-role-Glue-To-Redshift

jobs:
  configure-access:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Configure Production OIDC Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::654654263141:role/signet-gha-eadse-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Source Account
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          test "$ACCOUNT" = "$SOURCE_ACCOUNT_ID"
          echo "Source account verified."

      # STEP 1: Add the new Redshift role to Glue's existing policy.
      - name: Update Glue Inline Policy
        shell: bash
        run: |
          set -euo pipefail

          aws iam get-role-policy \
            --role-name "$GLUE_ROLE_NAME" \
            --policy-name "$GLUE_POLICY_NAME" \
            --query PolicyDocument \
            --output json > glue-policy.json

          jq --arg target "$REDSHIFT_ROLE_ARN" '
            .Statement = (
              (if (.Statement | type) == "array"
               then .Statement else [.Statement] end)
              | if any(.[];
                  .Effect == "Allow" and
                  (.Action == "sts:AssumeRole" or
                   ((.Action | type) == "array" and
                    (.Action | index("sts:AssumeRole")) != null)) and
                  (.Resource == $target or
                   ((.Resource | type) == "array" and
                    (.Resource | index($target)) != null))
                )
                then .
                else . + [{
                  "Sid": "AllowAssumeNewRedshiftRole",
                  "Effect": "Allow",
                  "Action": "sts:AssumeRole",
                  "Resource": $target
                }]
                end
            )
          ' glue-policy.json > updated-glue-policy.json

          aws iam put-role-policy \
            --role-name "$GLUE_ROLE_NAME" \
            --policy-name "$GLUE_POLICY_NAME" \
            --policy-document file://updated-glue-policy.json

          echo "Glue policy updated; existing statements preserved."

      # STEP 2: Attempt to assume the Redshift role with the same
      # OIDC-authenticated identity. This requires existing trust
      # and suitable permissions on the target role.
      - name: Assume Redshift Role for Trust Update
        shell: bash
        run: |
          set -euo pipefail

          CREDS=$(aws sts assume-role \
            --role-arn "$REDSHIFT_ROLE_ARN" \
            --role-session-name GitHubUpdateRedshiftTrust \
            --query Credentials \
            --output json)

          {
            echo "AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.AccessKeyId')"
            echo "AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.SecretAccessKey')"
            echo "AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.SessionToken')"
          } >> "$GITHUB_ENV"

      # STEP 3: Add Glue to the Redshift trust policy.
      - name: Update Redshift Trust Policy
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          test "$ACCOUNT" = "$TARGET_ACCOUNT_ID"

          aws iam get-role \
            --role-name "$REDSHIFT_ROLE_NAME" \
            --query Role.AssumeRolePolicyDocument \
            --output json > trust-policy.json

          jq --arg glue "$GLUE_ROLE_ARN" '
            .Statement = (
              (if (.Statement | type) == "array"
               then .Statement else [.Statement] end)
              | if any(.[];
                  .Effect == "Allow" and
                  (.Action == "sts:AssumeRole" or
                   ((.Action | type) == "array" and
                    (.Action | index("sts:AssumeRole")) != null)) and
                  (.Principal.AWS == $glue or
                   ((.Principal.AWS | type) == "array" and
                    (.Principal.AWS | index($glue)) != null))
                )
                then .
                else . + [{
                  "Sid": "AllowProductionGlueJob",
                  "Effect": "Allow",
                  "Principal": {"AWS": $glue},
                  "Action": "sts:AssumeRole"
                }]
                end
            )
          ' trust-policy.json > updated-trust-policy.json

          aws iam update-assume-role-policy \
            --role-name "$REDSHIFT_ROLE_NAME" \
            --policy-document file://updated-trust-policy.json

          echo "Redshift trust policy updated."

      - name: Verify Redshift Trust
        shell: bash
        run: |
          set -euo pipefail

          aws iam get-role \
            --role-name "$REDSHIFT_ROLE_NAME" \
            --query Role.AssumeRolePolicyDocument \
            --output json > verified-trust.json

          jq -e --arg glue "$GLUE_ROLE_ARN" '
            any(
              (if (.Statement | type) == "array"
               then .Statement else [.Statement] end)[];
              .Effect == "Allow" and
              (.Action == "sts:AssumeRole" or
               ((.Action | type) == "array" and
                (.Action | index("sts:AssumeRole")) != null)) and
              (.Principal.AWS == $glue or
               ((.Principal.AWS | type) == "array" and
                (.Principal.AWS | index($glue)) != null))
            )
          ' verified-trust.json > /dev/null

          echo "SUCCESS: Glue permission and Redshift trust verified."
