
AWSTemplateFormatVersion: "2010-09-09"
Description: Dedicated GitHub OIDC test role for reproducing and fixing trust-policy errors

Parameters:
  GitHubRepository:
    Type: String
    Default: hancy121/personal-glue-etl-iac

  GitHubBranch:
    Type: String
    Default: main

Resources:
  GitHubOIDCTestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubOIDCReproIaCRole

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub
                arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action:
              - sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub
                  - "repo:${Repository}:${Branch}"
                  - Repository: !Ref GitHubRepository
                    Branch: !Sub "ref:refs/heads/${GitHubBranch}"

Outputs:
  GitHubOIDCTestRoleArn:
    Description: Role ARN to use in the GitHub Actions OIDC test
    Value: !GetAtt GitHubOIDCTestRole.Arn
